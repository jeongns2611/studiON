[project]
name = "studion-ai"
version = "0.1.0"
description = "AI server for audio analysis, CLAP-based vocal detection, and LangGraph orchestration."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic-settings>=2.8,<3.0",
    "dramatiq[redis]>=1.17,<2.0",
    "redis>=5.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.15,<2.0",
    "pymysql>=1.1,<2.0",
    "pymongo>=4.12,<5.0",
    "qdrant-client>=1.14,<2.0",
    "langgraph>=0.4,<0.5",
    "langchain-core>=0.3,<0.4",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.1,<2.0",
    "orjson>=3.10,<4.0",
    "tenacity>=9.1,<10.0",
    "structlog>=25.3,<26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.26,<1.0",
    "ruff>=0.11,<0.12",
]
audio-dsp = [
    "numpy>=2.1,<3.0",
    "scipy>=1.15,<2.0",
    "librosa>=0.11,<0.12",
    "soundfile>=0.13,<0.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
