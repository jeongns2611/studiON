services:
  ai-api:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: studion-ai-api
    ports:
      - "8000:8000"
    env_file:
      - .env.ai
    depends_on:
      - ai-redis
    restart: unless-stopped

  ai-worker:
    build:
      context: ./AI
      dockerfile: Dockerfile
    env_file:
      - .env.ai
    depends_on:
      - ai-redis
    restart: unless-stopped
    command: uv run python -m dramatiq app.services.workflow_queue

  ai-redis:
    image: redis:7
    container_name: studion-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
